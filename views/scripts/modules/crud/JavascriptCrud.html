<script>
  const crudConfig = {
    siswa: {
      formWrapperId: 'formSiswa',
      tableId: 'tabelSiswa',
      titleFormId: 'titleFormSiswa',
      form: {
        id: { el: 'siswa_id', type: 'hidden' },
        nama: { el: 'siswa_nama', type: 'text', placeholder: 'Nama Lengkap' },
        kelas: { el: 'siswa_kelas', type: 'radio', options: ['XI', 'XII'] },
        jurusan: { el: 'siswa_jurusan', type: 'dropdown', options: ['-- Memuat Jurusan --'] }
      },
      btnSaveId: 'btnSimpanSiswa',
      btnCancelId: 'btnBatalSiswa',
      loader: ['getSiswa'],
      create: 'createSiswa',
      update: 'updateSiswa',
      delete: 'deleteSiswa',
      tableColumns: [
        { label: 'ID', key: 0 },
        { label: 'Nama', key: 1 },
        { label: 'Kelas', key: 2 },
        { label: 'Jurusan', key: 3 }
      ]
    },
    guru: {
      formWrapperId: 'formGuru',
      tableId: 'tabelGuru',
      titleFormId: 'titleFormGuru',
      form: {
        id: { el: 'guru_id', type: 'hidden' },
        nama: { el: 'guru_nama', type: 'text', placeholder: 'Nama Guru' },
        mapel: { el: 'guru_mapel', type: 'dropdown', options: ['-- Memuat Mapel --'] },
        nohp: { el: 'guru_nohp', type: 'text', placeholder: 'No HP' }
      },
      btnSaveId: 'btnSimpanGuru',
      btnCancelId: 'btnBatalGuru',
      loader: ['getGuru'],
      create: 'createGuru',
      update: 'updateGuru',
      delete: 'deleteGuru',
      tableColumns: [
        { label: 'ID', key: 0 },
        { label: 'Nama', key: 1 },
        { label: 'Mapel', key: 2 }
      ]
    },
    mapel: {
      formWrapperId: 'formMapel',
      tableId: 'tabelMapel',
      titleFormId: 'titleFormMapel',
      form: {
        id: { el: 'mapel_id', type: 'hidden' },
        nama: { el: 'mapel_nama', type: 'text', placeholder: 'Nama Mata Pelajaran' },
        kode: { el: 'mapel_kode', type: 'text', placeholder: 'Kode Mapel (misal: MTK-01)' }
      },
      btnSaveId: 'btnSimpanMapel',
      btnCancelId: 'btnBatalMapel',
      loader: ['getMapel'],
      create: 'createMapel',
      update: 'updateMapel',
      delete: 'deleteMapel',
      tableColumns: [
        { label: 'ID', key: 0 },
        { label: 'Nama', key: 1 },
        { label: 'Kode', key: 2 }
      ]
    },
    jurusan: {
      formWrapperId: 'formJurusan',
      tableId: 'tabelJurusan',
      titleFormId: 'titleFormJurusan',
      form: {
        id:   { el: 'jurusan_id', type: 'hidden' },
        nama: { el: 'jurusan_nama', type: 'text', placeholder: 'Nama Jurusan' },
        kode: { el: 'jurusan_kode', type: 'text', placeholder: 'Kode Jurusan' }
      },
      btnSaveId: 'btnSimpanJurusan',
      btnCancelId: 'btnBatalJurusan',
      loader: ['getJurusan'],
      create: 'createJurusan',
      update: 'updateJurusan',
      delete: 'deleteJurusan',
      tableColumns: [
        { label: 'ID', key: 0 },
        { label: 'Nama', key: 1 },
        { label: 'Kode', key: 2 }
      ]
    }
  };

  function renderForm(entity) {
    const cfg = crudConfig[entity];
    const wrapper = document.getElementById(cfg.formWrapperId);
    wrapper.innerHTML = `<h4 id="${cfg.titleFormId}" class="text-lg font-semibold mb-4 text-slate-700">Tambah ${capitalize(entity)}</h4>`;

    for (const key in cfg.form) {
      const field = cfg.form[key];
      let html = '';

      switch (field.type) {
        case 'hidden':
          html = `<input type="hidden" id="${field.el}">`;
          break;
        case 'text':
        case 'email':
        case 'number':
        case 'password':
          html = `<input type="${field.type}" id="${field.el}" placeholder="${field.placeholder || ''}" class="border p-2.5 rounded-lg w-full">`;
          break;
        case 'textarea':
          html = `<textarea id="${field.el}" placeholder="${field.placeholder || ''}" class="border p-2.5 rounded-lg w-full"></textarea>`;
          break;
        case 'radio':
          html = field.options.map(opt => `<label><input type="radio" name="${field.el}" value="${opt}"> ${opt}</label>`).join(' ');
          break;
        case 'dropdown':
          html = `<select id="${field.el}" class="border p-2.5 rounded-lg w-full">${field.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}</select>`;
          break;
      }

      wrapper.innerHTML += `<div class="mb-3">${html}</div>`;
    }

    wrapper.innerHTML += `
      <div class="flex gap-3">
        <button id="${cfg.btnSaveId}" onclick="simpanData('${entity}')" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg">Simpan</button>
        <button id="${cfg.btnCancelId}" onclick="resetForm('${entity}')" class="bg-slate-200 text-slate-700 px-5 py-2.5 rounded-lg hidden">Batal</button>
      </div>`;
  }

  function getFieldValue(field) {
    if (field.type === 'radio') {
      const checked = document.querySelector(`input[name="${field.el}"]:checked`);
      return checked ? checked.value : '';
    }
    const el = document.getElementById(field.el);
    return el ? el.value : '';
  }

  function setFieldValue(field, val) {
    if (field.type === 'radio') {
      const radios = document.querySelectorAll(`input[name="${field.el}"]`);
      radios.forEach(radio => {
        radio.checked = (radio.value === val);
      });
    } else {
      const el = document.getElementById(field.el);
      if (el) el.value = val;
    }
  }

  function loadData(entity) {
    const cfg = crudConfig[entity];
    const tbody = document.getElementById(cfg.tableId);
    tbody.innerHTML = '<tr><td colspan="99">Memuat...</td></tr>';

    if (!cfg.loader || cfg.loader.length === 0) {
      google.script.run.withSuccessHandler(data => renderTable(entity, data)).getSheet(entity);
    } else {
      cfg.loader.forEach(fn => {
        google.script.run.withSuccessHandler(data => renderTable(entity, data))[fn]();
      });
    }
  }

  function renderTable(entity, data) {
    const cfg = crudConfig[entity];
    const tbody = document.getElementById(cfg.tableId);
    tbody.innerHTML = '';

    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="99">Data kosong.</td></tr>';
      return;
    }

    data.forEach(row => {
      let cells = '';
      const columns = cfg.tableColumns || [];
      if (columns.length === 0) {
        cells = row.map(val => `<td>${val}</td>`).join('');
      } else {
        columns.forEach(col => {
          const val = row[col.key] !== undefined ? row[col.key] : '';
          cells += `<td>${val}</td>`;
        });
      }

      tbody.innerHTML += `
        <tr class="hover:bg-slate-50 border-b">
          ${cells}
          <td class="py-2 px-4 flex gap-2">
            <button onclick="editData('${entity}','${row.join("','")}')" class="text-blue-600 hover:underline">Edit</button>
            <button onclick="hapusData('${entity}','${row[0]}')" class="text-red-600 hover:underline">Hapus</button>
          </td>
        </tr>`;
    });
  }

  function simpanData(entity) {
    const cfg = crudConfig[entity];
    const obj = {};
    for (const key in cfg.form) {
      obj[key] = getFieldValue(cfg.form[key]);
    }
    if (!obj.nama) return showToast('Nama wajib diisi!', 'error');

    const btn = document.getElementById(cfg.btnSaveId);
    btn.innerText = 'Menyimpan...';

    const func = obj.id === '' ? cfg.create : cfg.update;
    gasRun(func, obj, res => {
      btn.innerText = 'Simpan';
      const message = res && typeof res === 'object' ? res.message || 'Operasi selesai.' : res;
      showToast(message, res && res.success === false ? 'error' : 'success');
      if (res && res.success !== false) {
        resetForm(entity);
        loadData(entity);
      }
    }, err => {
      btn.innerText = 'Simpan';
      showToast('Gagal menyimpan data: ' + (err && err.message ? err.message : err), 'error');
    });
  }

  function editData(entity, ...values) {
    const cfg = crudConfig[entity];
    document.getElementById(cfg.titleFormId).innerText = 'Edit ' + capitalize(entity);
    let i = 0;
    for (const key in cfg.form) {
      setFieldValue(cfg.form[key], values[i++] || '');
    }
    document.getElementById(cfg.btnCancelId).classList.remove('hidden');
  }

  function resetForm(entity) {
    const cfg = crudConfig[entity];
    document.getElementById(cfg.titleFormId).innerText = 'Tambah ' + capitalize(entity);
    for (const key in cfg.form) {
      setFieldValue(cfg.form[key], '');
    }
    document.getElementById(cfg.btnSaveId).innerText = 'Simpan';
    document.getElementById(cfg.btnCancelId).classList.add('hidden');
  }

  function hapusData(entity, id) {
    const cfg = crudConfig[entity];
    if (confirm('Hapus ' + entity + ' ini?')) {
      showToast('Menghapus...');
      gasRun(cfg.delete, id, res => {
        const message = res && typeof res === 'object' ? res.message || 'Operasi selesai.' : res;
        showToast(message, res && res.success === false ? 'error' : 'success');
        if (res && res.success !== false) {
          loadData(entity);
        }
      }, err => {
        showToast('Gagal menghapus data: ' + (err && err.message ? err.message : err), 'error');
      });
    }
  }

  // ==========================================
  // SISWA WRAPPER
  // ==========================================
  function loadDataSiswa() {
    populateSiswaJurusanDropdown();
    loadData('siswa');
  }
  function populateSiswaJurusanDropdown() {
    google.script.run.withSuccessHandler(listJurusan => {
      const selectEl = document.getElementById('siswa_jurusan');
      if (!selectEl) return;
      const currVal = selectEl.value;

      let html = '<option value="">-- Pilih Jurusan --</option>';
      if (listJurusan && listJurusan.length > 0) {
        listJurusan.forEach(j => {
          html += `<option value="${j.nama}">${j.nama}</option>`;
        });
      }
      selectEl.innerHTML = html;
      if (currVal) selectEl.value = currVal;
    }).getOptionsJurusan();
  }
  function simpanSiswa() { simpanData('siswa'); }
  function editSiswa() { editData('siswa'); }
  function resetFormSiswa() { resetForm('siswa'); }
  function hapusSiswa() { hapusData('siswa'); }
  renderForm('siswa');

  // ==========================================
  // GURU WRAPPER
  // ==========================================
  function loadDataGuru() {
    populateGuruMapelDropdown();
    loadData('guru');
  }
  function populateGuruMapelDropdown() {
    google.script.run.withSuccessHandler(listMapel => {
      const selectEl = document.getElementById('guru_mapel');
      if (!selectEl) return;
      const currVal = selectEl.value;

      let html = '<option value="">-- Pilih Mata Pelajaran --</option>';
      if (listMapel && listMapel.length > 0) {
        listMapel.forEach(m => {
          html += `<option value="${m.nama}">${m.nama} (${m.kode})</option>`;
        });
      }
      selectEl.innerHTML = html;
      if (currVal) selectEl.value = currVal;
    }).getOptionsMapel();
  }
  function simpanGuru() { simpanData('guru'); }
  function editGuru() { editData('guru'); }
  function resetFormGuru() { resetForm('guru'); }
  function hapusGuru() { hapusData('guru'); }
  renderForm('guru');

  // ==========================================
  // MAPEL WRAPPER
  // ==========================================
  function loadDataMapel() { loadData('mapel'); }
  function simpanMapel() { simpanData('mapel'); }
  function editMapel() { editData('mapel'); }
  function resetFormMapel() { resetForm('mapel'); }
  function hapusMapel() { hapusData('mapel'); }
  renderForm('mapel');

  // ==========================================
  // JURUSAN WRAPPER
  // ==========================================
  function loadDataJurusan() { loadData('jurusan'); }
  function simpanJurusan() { simpanData('jurusan'); }
  function editJurusan() { editData('jurusan'); }
  function resetFormJurusan() { resetForm('jurusan'); }
  function hapusJurusan() { hapusData('jurusan'); }
  renderForm('jurusan');
</script>
