<!-- ========================================== -->
  <!-- VIEW: LOGIN                                -->
  <!-- ========================================== -->
  <div id="viewLogin" class="flex items-center justify-center h-full w-full bg-slate-800">
    <div class="bg-white p-10 rounded-xl shadow-2xl w-96 max-w-full">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-slate-800">Siakad</h1>
        <p class="text-slate-500 text-sm mt-2">Login Admin Panel</p>
      </div>
      <div class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
          <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition">Masuk</button>
        <p id="loginMessage" class="text-red-500 text-center text-sm hidden"></p>
      </div>
    </div>
  </div>

  <script>
    function doLogin() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (!u || !p) return alert('Isi username & password!');

      const btn = document.getElementById('btnLogin');
      if (btn) btn.innerText = 'Loading...';

      const runLogin = typeof window.gasRun === 'function'
        ? window.gasRun
        : function(fnName, args, onSuccess, onError) {
            const successHandler = typeof onSuccess === 'function' ? onSuccess : () => {};
            const errorHandler = typeof onError === 'function' ? onError : () => {};
            const runner = google.script.run.withSuccessHandler(successHandler).withFailureHandler(errorHandler);
            if (Array.isArray(args)) {
              runner[fnName](...args);
            } else {
              runner[fnName](args);
            }
          };

      runLogin('checkLogin', [u, p], res => {
        if (btn) btn.innerText = 'Masuk';
        const result = (res && typeof res === 'object') ? res : { success: false, message: 'Respons server tidak valid.' };
        if (result.success) {
          document.getElementById('viewLogin').classList.add('hidden');
          document.getElementById('viewDashboard').classList.remove('hidden');
          if (typeof window.showToast === 'function') {
            window.showToast(res.message);
          } else {
            console.log(res.message);
          }
          if (typeof window.pindahMenu === 'function') {
            window.pindahMenu('dashboard');
          } else if (typeof window.__pindahMenu === 'function') {
            window.__pindahMenu('dashboard');
          } else if (typeof pindahMenu === 'function') {
            pindahMenu('dashboard');
          } else {
            console.error('pindahMenu belum siap');
            if (typeof window.loadDataDashboard === 'function') {
              window.loadDataDashboard();
            }
          }
        } else {
          if (typeof window.showToast === 'function') {
            window.showToast(result.message, 'error');
          }
        }
      }, err => {
        if (btn) btn.innerText = 'Masuk';
        if (typeof window.showToast === 'function') {
          window.showToast('Login gagal: ' + (err && err.message ? err.message : err), 'error');
        }
      });
    }

    function doLogout() {
      document.getElementById('viewDashboard').classList.add('hidden');
      document.getElementById('viewLogin').classList.remove('hidden');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    }

    window.prosesLogin = doLogin;
    window.prosesLogout = doLogout;

    function attachLoginHandlers() {
      const btn = document.getElementById('btnLogin');
      if (btn && !btn.dataset.bound) {
        btn.addEventListener('click', doLogin);
        btn.dataset.bound = 'true';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', attachLoginHandlers);
    } else {
      attachLoginHandlers();
    }
  </script>
