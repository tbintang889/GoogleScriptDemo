  <script>
    // --- UTILITAS ---
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('globalToast');
      toast.innerText = msg;
      toast.className = `fixed top-5 right-5 px-6 py-3 rounded shadow-lg text-white font-semibold z-50 fade-in ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    // --- REGISTRY DOKUMEN & MENU (ROBUST MENU REGISTRY) ---
    const menuRegistry = {
      siswa: {
        title: "Manajemen Data Siswa",
        loader: () => typeof loadDataSiswa === 'function' && loadDataSiswa()
      },
      guru: {
        title: "Manajemen Data Guru",
        loader: () => typeof loadDataGuru === 'function' && loadDataGuru()
      },
      mapel: {
        title: "Manajemen Data Mata Pelajaran",
        loader: () => typeof loadDataMapel === 'function' && loadDataMapel()
      },
      nilai: {
        title: "Manajemen Data Nilai Siswa",
        loader: () => typeof loadDataNilai === 'function' && loadDataNilai()
      },
      laporanNilai: {
        title: "📊 Laporan Rekapitulasi Nilai Siswa",
        loader: () => typeof loadDataLaporanNilai === 'function' && loadDataLaporanNilai()
      }
      // Untuk menambah menu/laporan baru di masa depan, cukup daftarkan 1 entry di sini
      // atau panggil: registerMenu('laporanPresensi', { title: '...', loader: fn })
    };

    /**
     * Helper untuk mendaftarkan menu baru secara dinamis
     */
    function registerMenu(menuKey, config) {
      menuRegistry[menuKey] = config;
    }

    // --- LOGIKA UI (Navigasi Modul) ---
    function pindahMenu(menu) {
      const cfg = menuRegistry[menu];

      // Sembunyikan semua modul yang terdaftar & reset style tombol sidebar
      Object.keys(menuRegistry).forEach(mKey => {
        const modulEl = document.getElementById('modul' + capitalize(mKey));
        const btnEl   = document.getElementById('menu' + capitalize(mKey) + 'Btn');

        if (modulEl) modulEl.classList.add('hidden');
        if (btnEl) {
          btnEl.className = "w-full text-left px-4 py-3 rounded-lg hover:bg-slate-800 text-slate-300 transition-colors";
        }
      });

      // Tampilkan modul aktif & aktifkan style tombol sidebar
      const activeModul = document.getElementById('modul' + capitalize(menu));
      const activeBtn   = document.getElementById('menu' + capitalize(menu) + 'Btn');

      if (activeModul) activeModul.classList.remove('hidden');
      if (activeBtn) {
        activeBtn.className = "w-full text-left px-4 py-3 rounded-lg bg-blue-600 text-white font-medium shadow-sm transition-colors";
      }

      // Ubah Judul Header secara otomatis sesuai registrasi menu
      const headerTitle = document.getElementById('headerTitle');
      if (headerTitle && cfg) {
        headerTitle.innerText = cfg.title || ("Manajemen Data " + capitalize(menu));
      }

      // Jalankan fungsi loader jika terdaftar
      if (cfg && typeof cfg.loader === 'function') {
        cfg.loader();
      }
    }

// helper untuk kapitalisasi
function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

  </script>

<script>
const crudConfig = {
  siswa: {
    formWrapperId: 'formSiswa',
    tableId: 'tabelSiswa',
    titleFormId: 'titleFormSiswa',
    form: {
      id:       { el:'siswa_id', type:'hidden' },
      nama:     { el:'siswa_nama', type:'text', placeholder:'Nama Lengkap' },    
      kelas:   { el:'siswa_kelas', type:'radio', options:['XI','XII'] },
      jurusan:   { el:'siswa_jurusan', type:'dropdown', options:['RPL','PPLG','TKJ'] },

    },
    btnSaveId: 'btnSimpanSiswa',
    btnCancelId: 'btnBatalSiswa',
    loader: ['getSiswa'],
    create: 'createSiswa',
    update: 'updateSiswa',
    delete: 'deleteSiswa',
    data: []
  },
  guru: {
    formWrapperId: 'formGuru',
    tableId: 'tabelGuru',
    titleFormId: 'titleFormGuru',
    form: { 
      id: { el:'guru_id', type:'hidden' }, 
      nama: { el:'guru_nama', type:'text', placeholder:'Nama Guru' }, 
      mapel: { el:'guru_mapel', type:'dropdown', options:['-- Memuat Mapel --'] }, 
      nohp: { el:'guru_nohp', type:'text', placeholder:'No HP' } 
    },
    btnSaveId: 'btnSimpanGuru',
    btnCancelId: 'btnBatalGuru',
    loader: ['getGuru'],
    create: 'createGuru',
    update: 'updateGuru',
    delete: 'deleteGuru',
    data: []
  },
  mapel: {
    formWrapperId: 'formMapel',
    tableId: 'tabelMapel',
    titleFormId: 'titleFormMapel',
    form: {
      id:   { el:'mapel_id', type:'hidden' },
      nama: { el:'mapel_nama', type:'text', placeholder:'Nama Mata Pelajaran' },
      kode: { el:'mapel_kode', type:'text', placeholder:'Kode Mapel (misal: MTK-01)' }
    },
    btnSaveId: 'btnSimpanMapel',
    btnCancelId: 'btnBatalMapel',
    loader: ['getMapel'],
    create: 'createMapel',
    update: 'updateMapel',
    delete: 'deleteMapel',
    data: []
  }
};
// RENDER FORM

function renderForm(entity) {
  const cfg = crudConfig[entity];
  const wrapper = document.getElementById(cfg.formWrapperId);
  wrapper.innerHTML = `<h4 id="${cfg.titleFormId}" class="text-lg font-semibold mb-4 text-slate-700">Tambah ${capitalize(entity)}</h4>`; // kosongkan isi & set judul

  for (let key in cfg.form) {
    const field = cfg.form[key];
    let html = '';

    switch(field.type) {
      case 'hidden':
        html = `<input type="hidden" id="${field.el}">`;
        break;
      case 'text':
      case 'email':
      case 'number':
      case 'password':
        html = `<input type="${field.type}" id="${field.el}" placeholder="${field.placeholder||''}" class="border p-2.5 rounded-lg w-full">`;
        break;
      case 'textarea':
        html = `<textarea id="${field.el}" placeholder="${field.placeholder||''}" class="border p-2.5 rounded-lg w-full"></textarea>`;
        break;
      case 'radio':
        html = field.options.map(opt =>
          `<label><input type="radio" name="${field.el}" value="${opt}"> ${opt}</label>`
        ).join(' ');
        break;
      case 'dropdown':
        html = `<select id="${field.el}" class="border p-2.5 rounded-lg w-full">` +
               field.options.map(opt=>`<option value="${opt}">${opt}</option>`).join('') +
               `</select>`;
        break;
    }

    wrapper.innerHTML += `<div class="mb-3">${html}</div>`;
  }

  // tombol simpan & batal
  wrapper.innerHTML += `
    <div class="flex gap-3">
      <button id="${cfg.btnSaveId}" onclick="simpanData('${entity}')" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg">Simpan</button>
      <button id="${cfg.btnCancelId}" onclick="resetForm('${entity}')" class="bg-slate-200 text-slate-700 px-5 py-2.5 rounded-lg hidden">Batal</button>
    </div>`;
}

// --- HELPER UNTUK FORM ---
function getFieldValue(field) {
  if (field.type === 'radio') {
    const checked = document.querySelector(`input[name="${field.el}"]:checked`);
    return checked ? checked.value : '';
  }
  const el = document.getElementById(field.el);
  return el ? el.value : '';
}

function setFieldValue(field, val) {
  if (field.type === 'radio') {
    const radios = document.querySelectorAll(`input[name="${field.el}"]`);
    radios.forEach(radio => {
      radio.checked = (radio.value === val);
    });
  } else {
    const el = document.getElementById(field.el);
    if (el) el.value = val;
  }
}

// --- LOAD DATA ---
function loadData(entity) {
  const cfg = crudConfig[entity];
  const tbody = document.getElementById(cfg.tableId);
  tbody.innerHTML = '<tr><td colspan="99">Memuat...</td></tr>';

  // jika loader kosong → ambil sheet default
  if (!cfg.loader || cfg.loader.length === 0) {
    google.script.run.withSuccessHandler(data => renderTable(entity, data)).getSheet(entity);
  } else {
    cfg.loader.forEach(fn => {
      google.script.run.withSuccessHandler(data => renderTable(entity, data))[fn]();
    });
  }
}

// --- RENDER TABLE ---
function renderTable(entity, data) {
  const cfg = crudConfig[entity];
  const tbody = document.getElementById(cfg.tableId);
  tbody.innerHTML = '';

  if(data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="99">Data kosong.</td></tr>';
    return;
  }

  data.forEach(row => {
    let cells = '';
    if(cfg.data.length === 0) {
      // tampilkan semua kolom
      cells = row.map(val=>`<td>${val}</td>`).join('');
    } else {
      // tampilkan hanya kolom tertentu
      cfg.data.forEach((colName, idx) => {
        let val = row[idx]; // asumsi urutan sesuai sheet
        cells += `<td>${val}</td>`;
      });
    }

    tbody.innerHTML += `
      <tr class="hover:bg-slate-50 border-b">
        ${cells}
        <td class="py-2 px-4 flex gap-2">
          <button onclick="editData('${entity}','${row.join("','")}')" class="text-blue-600 hover:underline">Edit</button>
          <button onclick="hapusData('${entity}','${row[0]}')" class="text-red-600 hover:underline">Hapus</button>
        </td>
      </tr>`;
  });
}

// --- SIMPAN DATA ---
function simpanData(entity) {
  const cfg = crudConfig[entity];
  let obj = {};
  for (let key in cfg.form) {
    obj[key] = getFieldValue(cfg.form[key]);
  }
  if(!obj.nama) return showToast("Nama wajib diisi!", "error");

  let btn = document.getElementById(cfg.btnSaveId);
  btn.innerText = "Menyimpan...";

  let func = obj.id === "" ? cfg.create : cfg.update;
  google.script.run.withSuccessHandler(res => {
    showToast(res);
    resetForm(entity);
    loadData(entity);
  })[func](obj);
}

// --- EDIT DATA ---
function editData(entity, ...values) {
  const cfg = crudConfig[entity];
  document.getElementById(cfg.titleFormId).innerText = "Edit " + capitalize(entity);
  let i = 0;
  for (let key in cfg.form) {
    setFieldValue(cfg.form[key], values[i++] || "");
  }
  document.getElementById(cfg.btnCancelId).classList.remove('hidden');
}

// --- RESET FORM ---
function resetForm(entity) {
  const cfg = crudConfig[entity];
  document.getElementById(cfg.titleFormId).innerText = "Tambah " + capitalize(entity);
  for (let key in cfg.form) {
    setFieldValue(cfg.form[key], "");
  }
  document.getElementById(cfg.btnSaveId).innerText = "Simpan";
  document.getElementById(cfg.btnCancelId).classList.add('hidden');
}

// --- HAPUS DATA ---
function hapusData(entity, id) {
  const cfg = crudConfig[entity];
  if(confirm("Hapus " + entity + " ini?")) {
    showToast("Menghapus...");
    google.script.run.withSuccessHandler(res => {
      showToast(res);
      loadData(entity);
    })[cfg.delete](id);
  }
}

// --- HELPER ---
function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}


</script>

  <script>
    // --- LOGIKA MODUL NILAI (JOIN & FILTER BY SISWA / GURU) ---
    let rawNilaiData = [];

    function loadDataNilai() {
      // 1. Load opsi dropdown Siswa dan Guru
      google.script.run.withSuccessHandler(populateOptionsSiswaDanGuru).getOptionsSiswaDanGuru();

      // 2. Load data Nilai ter-JOIN dari server
      const tbody = document.getElementById('tabelNilai');
      tbody.innerHTML = '<tr><td colspan="6" class="py-4 text-center text-slate-500">Memuat data nilai...</td></tr>';

      google.script.run.withSuccessHandler(res => {
        rawNilaiData = res || [];
        renderTabelNilai(rawNilaiData);
      }).getNilai();
    }

    function populateOptionsSiswaDanGuru(res) {
      if (!res) return;
      
      const selSiswaForm = document.getElementById('nilai_siswa_id');
      const selGuruForm  = document.getElementById('nilai_guru_id');
      const filterSiswa  = document.getElementById('filterBySiswa');
      const filterGuru   = document.getElementById('filterByGuru');

      // Simpan pilihan yang sedang terpilih agar tidak hilang saat reload
      const currSiswa = selSiswaForm.value;
      const currGuru  = selGuruForm.value;

      // Populasikan Siswa
      let optSiswaHtml = '<option value="">-- Pilih Siswa --</option>';
      let optFilterSiswaHtml = '<option value="">-- Semua Siswa --</option>';
      res.siswa.forEach(s => {
        optSiswaHtml += `<option value="${s.id}">${s.nama}</option>`;
        optFilterSiswaHtml += `<option value="${s.id}">${s.nama}</option>`;
      });
      selSiswaForm.innerHTML = optSiswaHtml;
      filterSiswa.innerHTML = optFilterSiswaHtml;
      if (currSiswa) selSiswaForm.value = currSiswa;

      // Populasikan Guru
      let optGuruHtml = '<option value="">-- Pilih Guru / Mapel --</option>';
      let optFilterGuruHtml = '<option value="">-- Semua Guru / Mapel --</option>';
      res.guru.forEach(g => {
        optGuruHtml += `<option value="${g.id}">${g.nama}</option>`;
        optFilterGuruHtml += `<option value="${g.id}">${g.nama}</option>`;
      });
      selGuruForm.innerHTML = optGuruHtml;
      filterGuru.innerHTML = optFilterGuruHtml;
      if (currGuru) selGuruForm.value = currGuru;
    }

    function renderTabelNilai(dataList) {
      const tbody = document.getElementById('tabelNilai');
      tbody.innerHTML = '';

      if (!dataList || dataList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="py-4 text-center text-slate-500">Belum ada data nilai.</td></tr>';
        return;
      }

      dataList.forEach(row => {
        // row structure: [id, siswaId, namaSiswa, guruId, namaGuru, nilai, predikat]
        const [id, siswaId, namaSiswa, guruId, namaGuru, nilai, predikat] = row;
        
        let badgeColor = 'bg-slate-100 text-slate-700';
        if (predikat.startsWith('A')) badgeColor = 'bg-emerald-100 text-emerald-700 font-semibold';
        else if (predikat.startsWith('B')) badgeColor = 'bg-blue-100 text-blue-700 font-semibold';
        else if (predikat.startsWith('C')) badgeColor = 'bg-amber-100 text-amber-700 font-semibold';
        else if (predikat.startsWith('D')) badgeColor = 'bg-red-100 text-red-700 font-semibold';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 border-b">
            <td class="py-3 px-4 font-mono text-xs font-semibold text-slate-600">${id}</td>
            <td class="py-3 px-4 font-medium text-slate-800">${namaSiswa}</td>
            <td class="py-3 px-4 text-slate-700">${namaGuru}</td>
            <td class="py-3 px-4 text-center font-bold text-slate-800">${nilai}</td>
            <td class="py-3 px-4 text-center"><span class="px-2.5 py-1 rounded-full text-xs ${badgeColor}">${predikat}</span></td>
            <td class="py-3 px-4 text-center space-x-2">
              <button onclick="editNilai('${id}','${siswaId}','${guruId}','${nilai}','${predikat}')" class="text-blue-600 hover:text-blue-800 font-medium text-xs">Edit</button>
              <button onclick="hapusNilai('${id}')" class="text-red-600 hover:text-red-800 font-medium text-xs">Hapus</button>
            </td>
          </tr>`;
      });
    }

    function filterTabelNilai() {
      const selectedSiswaId = document.getElementById('filterBySiswa').value;
      const selectedGuruId  = document.getElementById('filterByGuru').value;

      let filtered = rawNilaiData.filter(row => {
        // row[1] is siswaId, row[3] is guruId
        const matchSiswa = selectedSiswaId === '' || row[1] === selectedSiswaId;
        const matchGuru  = selectedGuruId  === '' || row[3] === selectedGuruId;
        return matchSiswa && matchGuru;
      });

      renderTabelNilai(filtered);
    }

    function resetFilterNilai() {
      document.getElementById('filterBySiswa').value = '';
      document.getElementById('filterByGuru').value = '';
      renderTabelNilai(rawNilaiData);
    }

    function simpanNilai() {
      const id       = document.getElementById('nilai_id').value;
      const siswa_id = document.getElementById('nilai_siswa_id').value;
      const guru_id  = document.getElementById('nilai_guru_id').value;
      const nilai    = document.getElementById('nilai_angka').value;
      const predikat = document.getElementById('nilai_predikat').value;

      if (!siswa_id) return showToast("Silakan pilih siswa!", "error");
      if (!guru_id) return showToast("Silakan pilih guru!", "error");
      if (nilai === "" || nilai < 0 || nilai > 100) return showToast("Isi nilai antara 0 - 100!", "error");

      const obj = { id, siswa_id, guru_id, nilai, predikat };
      const btn = document.getElementById('btnSimpanNilai');
      btn.innerText = "Menyimpan...";

      const func = (id === "") ? 'createNilai' : 'updateNilai';

      google.script.run.withSuccessHandler(res => {
        showToast(res);
        resetFormNilai();
        loadDataNilai();
      })[func](obj);
    }

    function editNilai(id, siswaId, guruId, nilai, predikat) {
      document.getElementById('titleFormNilai').innerText = "✏️ Edit Nilai Siswa";
      document.getElementById('nilai_id').value = id;
      document.getElementById('nilai_siswa_id').value = siswaId;
      document.getElementById('nilai_guru_id').value = guruId;
      document.getElementById('nilai_angka').value = nilai;
      document.getElementById('nilai_predikat').value = predikat;

      document.getElementById('btnSimpanNilai').innerText = "Update Nilai";
      document.getElementById('btnBatalNilai').classList.remove('hidden');
    }

    function resetFormNilai() {
      document.getElementById('titleFormNilai').innerText = "📝 Input / Edit Nilai Siswa";
      document.getElementById('nilai_id').value = '';
      document.getElementById('nilai_siswa_id').value = '';
      document.getElementById('nilai_guru_id').value = '';
      document.getElementById('nilai_angka').value = '';
      document.getElementById('nilai_predikat').value = '';

      document.getElementById('btnSimpanNilai').innerText = "Simpan Nilai";
      document.getElementById('btnBatalNilai').classList.add('hidden');
    }

    function hapusNilai(id) {
      if (confirm("Apakah Anda yakin ingin menghapus data nilai " + id + "?")) {
        showToast("Menghapus...");
        google.script.run.withSuccessHandler(res => {
          showToast(res);
          loadDataNilai();
        }).deleteNilai(id);
      }
    }

  <script>
    // --- LOGIKA MODUL LAPORAN NILAI (READ ONLY + FILTER & STATISTIK) ---
    let rawLaporanData = [];

    function loadDataLaporanNilai() {
      const tbody = document.getElementById('tabelLaporanNilai');
      tbody.innerHTML = '<tr><td colspan="6" class="py-6 text-center text-slate-500">Memuat data laporan...</td></tr>';

        populateFilterLaporanOptions(res.filterOptions);
        renderLaporanTable(rawLaporanData);
      }).getLaporanNilai();

    function populateFilterLaporanOptions(opts) {
      if (!opts) return;

      const selMapel = document.getElementById('filterLaporanMapel');
      const selGuru  = document.getElementById('filterLaporanGuru');
      const selSiswa = document.getElementById('filterLaporanSiswa');

      // Mapel
      let mapelHtml = '<option value="">-- Semua Mata Pelajaran --</option>';
      opts.mapel.forEach(m => {
        mapelHtml += `<option value="${m}">${m}</option>`;
      });
      selMapel.innerHTML = mapelHtml;

      // Guru
      let guruHtml = '<option value="">-- Semua Guru --</option>';
      opts.guru.forEach(g => {
        guruHtml += `<option value="${g.id}">${g.nama}</option>`;
      });
      selGuru.innerHTML = guruHtml;

      // Siswa
      let siswaHtml = '<option value="">-- Semua Siswa --</option>';

        siswaHtml += `<option value="${s.id}">${s.nama}</option>`;
      });
      selSiswa.innerHTML = siswaHtml;
    }

    function renderLaporanTable(dataList) {
      const tbody = document.getElementById('tabelLaporanNilai');
      tbody.innerHTML = '';

      // Update Statistik Cards
      const total = dataList.length;
      document.getElementById('statTotalPenilaian').innerText = total;

      if (total === 0) {
        document.getElementById('statRataRata').innerText = "0";
        document.getElementById('statTertinggi').innerText = "0";
        document.getElementById('statTerendah').innerText = "0";

        tbody.innerHTML = '<tr><td colspan="6" class="py-6 text-center text-slate-500">Data laporan tidak ditemukan.</td></tr>';
        return;
      }

      let sum = 0;
      let max = dataList[0].nilai;
      let min = dataList[0].nilai;

      dataList.forEach((item, index) => {
        const val = Number(item.nilai);
        sum += val;
        if (val > max) max = val;
        if (val < min) min = val;

        let badgeColor = 'bg-slate-100 text-slate-700';
        if (item.predikat.startsWith('A')) badgeColor = 'bg-emerald-100 text-emerald-700 font-semibold';
        else if (item.predikat.startsWith('B')) badgeColor = 'bg-blue-100 text-blue-700 font-semibold';
        else if (item.predikat.startsWith('C')) badgeColor = 'bg-amber-100 text-amber-700 font-semibold';
        else if (item.predikat.startsWith('D')) badgeColor = 'bg-red-100 text-red-700 font-semibold';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 border-b">
            <td class="py-3 px-4 text-center font-medium text-slate-500">${index + 1}</td>
            <td class="py-3 px-4 font-medium text-slate-800">${item.namaSiswa}</td>
            <td class="py-3 px-4 text-slate-700"><span class="bg-slate-100 px-2 py-1 rounded text-xs">${item.mapel}</span></td>
            <td class="py-3 px-4 text-slate-700">${item.namaGuru}</td>
            <td class="py-3 px-4 text-center font-bold text-slate-800">${item.nilai}</td>
            <td class="py-3 px-4 text-center"><span class="px-2.5 py-1 rounded-full text-xs ${badgeColor}">${item.predikat}</span></td>
          </tr>`;
      });

      const avg = (sum / total).toFixed(1);
      document.getElementById('statRataRata').innerText = avg;
      document.getElementById('statTertinggi').innerText = max;
      document.getElementById('statTerendah').innerText = min;
    }

    function applyFilterLaporan() {
      const selectedMapel = document.getElementById('filterLaporanMapel').value;
      const selectedGuru  = document.getElementById('filterLaporanGuru').value;
      const selectedSiswa = document.getElementById('filterLaporanSiswa').value;

      let filtered = rawLaporanData.filter(item => {
        const matchMapel = selectedMapel === '' || item.mapel === selectedMapel;
        const matchGuru  = selectedGuru  === '' || item.guruId === selectedGuru;
        const matchSiswa = selectedSiswa === '' || item.siswaId === selectedSiswa;
        return matchMapel && matchGuru && matchSiswa;
      });

      renderLaporanTable(filtered);
    }

    function resetFilterLaporan() {
      document.getElementById('filterLaporanMapel').value = '';
      document.getElementById('filterLaporanGuru').value = '';
      document.getElementById('filterLaporanSiswa').value = '';
      renderLaporanTable(rawLaporanData);
    }
  </script>
