<!-- ========================================== -->
<!-- MODUL: LAPORAN NILAI                       -->
<!-- ========================================== -->
<div id="modulLaporanNilai" class="hidden fade-in space-y-6">

  <!-- Header Laporan -->
  <div class="bg-white p-6 rounded-xl shadow-sm border flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <h4 class="text-xl font-bold text-slate-800">📊 Laporan Rekapitulasi Nilai</h4>
      <p class="text-sm text-slate-500 mt-1">Laporan terpadu hasil penilaian akademik siswa berdasarkan mata pelajaran dan guru pengampu.</p>
    </div>
    <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-sm flex items-center gap-2 transition">
      🖨️ Cetak / Print Laporan
    </button>
  </div>

  <!-- Cards Ringkasan Statistik -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <div class="bg-white p-5 rounded-xl border shadow-sm flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold uppercase text-slate-400">Total Penilaian</p>
        <h3 id="statTotalPenilaian" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
      </div>
      <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-xl">📄</div>
    </div>

    <div class="bg-white p-5 rounded-xl border shadow-sm flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold uppercase text-slate-400">Rata-Rata Nilai</p>
        <h3 id="statRataRata" class="text-2xl font-bold text-blue-600 mt-1">0</h3>
      </div>
      <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">📈</div>
    </div>

    <div class="bg-white p-5 rounded-xl border shadow-sm flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold uppercase text-slate-400">Nilai Tertinggi</p>
        <h3 id="statTertinggi" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
      </div>
      <div class="w-12 h-12 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center text-xl">⭐</div>
    </div>

    <div class="bg-white p-5 rounded-xl border shadow-sm flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold uppercase text-slate-400">Nilai Terendah</p>
        <h3 id="statTerendah" class="text-2xl font-bold text-red-500 mt-1">0</h3>
      </div>
      <div class="w-12 h-12 rounded-full bg-red-50 text-red-600 flex items-center justify-center text-xl">📉</div>
    </div>
  </div>

  <!-- Filter Bar & Table Area -->
  <div class="bg-white rounded-xl shadow-sm border p-6 space-y-5">
    
    <!-- Filter Control Group -->
    <div class="bg-slate-50 p-4 rounded-xl border flex flex-col md:flex-row items-center gap-4">
      <span class="text-sm font-semibold text-slate-700 whitespace-nowrap">🔍 Filter Laporan:</span>
      
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full">
        <!-- Filter Mapel -->
        <div>
          <select id="filterLaporanMapel" onchange="applyFilterLaporan()" class="w-full border p-2 rounded-lg text-sm bg-white border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">-- Semua Mata Pelajaran --</option>
          </select>
        </div>

        <!-- Filter Guru -->
        <div>
          <select id="filterLaporanGuru" onchange="applyFilterLaporan()" class="w-full border p-2 rounded-lg text-sm bg-white border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">-- Semua Guru --</option>
          </select>
        </div>

        <!-- Filter Siswa -->
        <div>
          <select id="filterLaporanSiswa" onchange="applyFilterLaporan()" class="w-full border p-2 rounded-lg text-sm bg-white border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">-- Semua Siswa --</option>
          </select>
        </div>
      </div>

      <button onclick="resetFilterLaporan()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium px-4 py-2 rounded-lg whitespace-nowrap transition">
        Reset Filter
      </button>
    </div>

    <!-- Table Laporan -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead class="bg-slate-100 border-b text-slate-700 text-xs uppercase font-bold tracking-wider">
          <tr>
            <th class="py-3.5 px-4 text-center w-12">No</th>
            <th class="py-3.5 px-4">Siswa</th>
            <th class="py-3.5 px-4">Mata Pelajaran</th>
            <th class="py-3.5 px-4">Guru</th>
            <th class="py-3.5 px-4 text-center">Nilai</th>
            <th class="py-3.5 px-4 text-center">Predikat</th>
          </tr>
        </thead>
        <tbody id="tabelLaporanNilai" class="divide-y divide-slate-100 text-sm">
          <tr>
            <td colspan="6" class="py-6 text-center text-slate-500">Memuat data laporan...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</div>
